name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  server:
    name: Server archives and image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushing the cask means writing to a second repository, which
          # the job's own GITHUB_TOKEN cannot do.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # The plug-in links libgimp through cgo and cannot be cross-compiled, so
  # each target builds on its own runner with GIMP's development files
  # installed, and appends its archive to the release the server job created.
  plugin:
    name: Plug-in ${{ matrix.target }}
    needs: server
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux_amd64
            runs-on: ubuntu-latest
            container: debian:trixie
          - target: linux_arm64
            runs-on: ubuntu-24.04-arm
            container: debian:trixie
          - target: darwin_amd64
            runs-on: macos-15-intel
          - target: darwin_arm64
            runs-on: macos-15
          - target: windows_amd64
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: ${{ startsWith(matrix.target, 'windows') && 'msys2 {0}' || 'bash' }}
    steps:
      # The container starts bare, and actions/checkout needs git present.
      - name: Install build dependencies (Linux)
        if: startsWith(matrix.target, 'linux')
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gcc pkg-config libgimp-3.0-dev

      # MSYS2 supplies GIMP 3's headers and import libraries on Windows;
      # UCRT64 is the GCC environment cgo needs.
      - name: Set up MSYS2 (Windows)
        if: startsWith(matrix.target, 'windows')
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf

      # GIMP is installed separately because its dependency chain reaches
      # Fortran and BLAS runtimes that MSYS2's repo periodically leaves
      # unresolvable mid-rebuild (gegl -> openblas -> gcc-libgfortran ->
      # gcc-libs). pacman then drops gimp from the transaction and still
      # exits 0, so the build fails much later with a confusing
      # "Package gimp-3.0 was not found". None of those runtimes are needed
      # to compile against libgimp's headers, so they are assumed present,
      # and the install is verified rather than trusted.
      - name: Install GIMP (Windows)
        if: startsWith(matrix.target, 'windows')
        run: |
          pacman -S --noconfirm --needed \
            --assume-installed mingw-w64-ucrt-x86_64-gcc-libs \
            --assume-installed mingw-w64-ucrt-x86_64-openblas \
            --assume-installed mingw-w64-ucrt-x86_64-ffmpeg \
            --assume-installed mingw-w64-ucrt-x86_64-suitesparse \
            mingw-w64-ucrt-x86_64-gimp
          pacman -Qi mingw-w64-ucrt-x86_64-gimp > /dev/null || {
            echo "::error::pacman reported success but GIMP is not installed"
            exit 1
          }

      - name: Install GIMP (macOS)
        if: startsWith(matrix.target, 'darwin')
        # The image's tap snapshot can predate the GIMP that bundles the
        # pkg-config files the build needs, so refresh it first.
        run: |
          brew update
          brew install --cask gimp

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # actions/checkout adds the safe.directory entry under a temporary HOME,
      # so git in later steps still sees the workspace as owned by another user.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: plugin/go.sum

      - name: Configure the build for this platform
        run: |
          case "${{ matrix.target }}" in
            darwin_*)
              # GIMP.app ships its own headers and libraries, and does not put
              # them on the loader path for plug-ins, so the location is baked
              # in as an rpath. The layout has moved between releases, so find
              # the file rather than assuming where it lives.
              pc=$(find /Applications/GIMP.app -name gimp-3.0.pc -print -quit)
              if [ -z "$pc" ]; then
                echo "::error::gimp-3.0.pc not found in GIMP.app"
                find /Applications/GIMP.app -maxdepth 3 -type d
                exit 1
              fi
              libdir=$(dirname "$(dirname "$pc")")
              echo "PKG_CONFIG_PATH=$(dirname "$pc")" >> "$GITHUB_ENV"
              echo "CGO_LDFLAGS=-Wl,-rpath,$libdir" >> "$GITHUB_ENV"
              ;;
            windows_*)
              # GoReleaser is a native action rather than a run step, so it
              # never sees the MSYS2 shell: it inherits the runner's PATH,
              # where C:\mingw64 shadows UCRT64 and links a C runtime that
              # does not match libgimp. Pin both tools to the UCRT64 copies
              # and put that prefix first for everything else.
              #
              # The values have to be Windows paths because cgo execs them
              # verbatim, and cygpath drops the extension while cgo does not
              # consult PATHEXT, so each one names the .exe outright.
              for tool in pkgconf gcc; do
                unix_path=$(command -v "$tool") || {
                  echo "::error::$tool not found in the UCRT64 environment"
                  exit 1
                }
                win_path=$(cygpath -w "$unix_path")
                case "$win_path" in *.exe) ;; *) win_path="$win_path.exe" ;; esac
                if [ ! -x "$(cygpath -u "$win_path")" ]; then
                  echo "::error::$tool missing at $win_path"
                  exit 1
                fi
                case "$tool" in
                  pkgconf) echo "PKG_CONFIG=$win_path" >> "$GITHUB_ENV" ;;
                  gcc) echo "CC=$win_path" >> "$GITHUB_ENV" ;;
                esac
              done
              cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
              ;;
          esac

      - name: Verify libgimp is discoverable
        run: |
          pkg-config --modversion gimp-3.0
          pkg-config --cflags gimp-3.0
          "${CC:-gcc}" -dumpmachine

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release -f .goreleaser.plugin.yml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_TARGET: ${{ matrix.target }}
          CGO_ENABLED: "1"

  # Each plug-in target releases from its own runner, so no single GoReleaser
  # run ever holds both macOS archives, and a cask needs both checksums at
  # once. It is rendered here instead, after every target has uploaded.
  cask:
    name: Plug-in cask
    needs: plugin
    runs-on: ubuntu-latest
    # Matches skip_upload: auto on the server cask: prereleases stay out of
    # the tap.
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v5

      - name: Render the cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir dl --pattern 'gimp-mcp-plugin_Darwin_*.tar.gz'
          arm=$(sha256sum dl/gimp-mcp-plugin_Darwin_arm64.tar.gz | cut -d' ' -f1)
          intel=$(sha256sum dl/gimp-mcp-plugin_Darwin_x86_64.tar.gz | cut -d' ' -f1)
          sed -e "s|@VERSION@|${GITHUB_REF_NAME#v}|" \
              -e "s|@ARM_SHA256@|$arm|" \
              -e "s|@INTEL_SHA256@|$intel|" \
              packaging/gimp-mcp-plugin.rb.tmpl > gimp-mcp-plugin.rb
          if grep -q '@[A-Z][A-Z0-9_]*@' gimp-mcp-plugin.rb; then
            echo "::error::unsubstituted placeholder in the cask"
            exit 1
          fi
          cat gimp-mcp-plugin.rb

      - name: Check it parses
        run: ruby -c gimp-mcp-plugin.rb

      - name: Push it to the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/ryancurrah/homebrew-tap.git" tap
          cp gimp-mcp-plugin.rb tap/Casks/
          cd tap
          git config user.name "goreleaser-bot"
          git config user.email "bot@goreleaser.com"
          git add Casks/gimp-mcp-plugin.rb
          git diff --quiet --cached || git commit -m "gimp-mcp-plugin: $GITHUB_REF_NAME"
          git push
